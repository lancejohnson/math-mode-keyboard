<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Courses · Math Mode</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png?v=2">
<meta name="apple-mobile-web-app-title" content="Math Mode">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Your Math Mode courses and how far you are in each.">
<script src="/nav.js?v=10" defer></script>
<link rel="stylesheet" href="/trig/lesson.css?v=13">
<style>
/* Course chooser (style A): one card per course with a progress ring in the course's color; tap a card to open it. */
.courses{display:grid;gap:12px;margin-top:var(--space-xs)}
.course{display:flex;gap:16px;align-items:center;margin:0;padding:16px}
.course small{display:block;color:var(--dim);font-size:14px;font-weight:600}
.course h3{font-size:20px;margin:1px 0 4px}
.course .dim{display:block}
</style>
</head>
<body>
<header class="top"><b>Courses</b><small id="count"></small></header>
<main class="courses" id="courses"></main>
<script type="module">
import { ring } from '/ring.js?v=1';
// Each course reads its own progress from localStorage (the same keys its pages write).
const read = k => { try { return JSON.parse(localStorage.getItem(k) || '{}') || {}; } catch { return {}; } };
const TRIG = ['turns', 'thirty', 'negative', 'pi', 'quarters', 'sixths', 'convert', 'by-heart', 'wrap', 'why-pi', 'arc'];
const KELLY = [['intuition', 'Why not bet it all?'], ['derive', 'Derive it yourself'], ['invest', 'Kelly for investing'], ['variants', 'Variants']];
const t = read('trig-unit1-v2').done || [], k = read('kelly-v1').done || [];
const tn = TRIG.filter(id => t.includes(id)).length, kn = KELLY.filter(([id]) => k.includes(id)).length;
const kNext = KELLY.find(([id]) => !k.includes(id));
const COURSES = [
  { id: 'trig', href: '/trig/', kind: 'Trigonometry · 12 units', title: 'Intuition first', color: 'var(--color-accent-hi)',
    share: tn / TRIG.length, caption: 'Unit 1',
    status: tn === TRIG.length ? 'Unit 1 done · Unit 2 next' : tn ? `Unit 1 · ${tn} of ${TRIG.length} topics` : 'Not started' },
  { id: 'kelly', href: '/kelly/' + (kNext && kn ? '#' + kNext[0] : ''), kind: 'Probability · 4 parts', title: 'The Kelly criterion', color: 'var(--color-violet)',
    share: kn / KELLY.length, caption: '',
    status: kn === KELLY.length ? 'All 4 parts done' : kn ? `${kn} of 4 parts · next: ${kNext[1]}` : 'Not started' },
];
const started = COURSES.filter(c => c.share > 0 && c.share < 1).length;
document.getElementById('count').textContent = started ? `${started} in progress` : `${COURSES.length} courses`;
document.getElementById('courses').innerHTML = COURSES.map(c => `<a class="card course" id="c-${c.id}" href="${c.href}">
  ${ring(c.share, c.color, 72, `${Math.round(c.share * 100)}%`, c.caption)}<span class="grow"><small>${c.kind}</small><h3>${c.title}</h3><span class="dim">${c.status}</span></span></a>`).join('');
</script>
</body>
</html>
