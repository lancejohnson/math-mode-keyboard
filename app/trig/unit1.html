<body>
<div id="listView">
  <nav class="crumb"><a href="./">← Trigonometry</a></nav>

    <small>Unit 1 of 12</small>
    <h1>Angles and radians</h1>
    <p class="dim">Small steps. Each topic is one idea, a quick example, then practice until you get 4 right.</p>

    <p class="dim" id="unitStatus"></p>
  </header>
  <section class="topics" id="topicList"></section>

<div id="topicView" hidden>
  <nav class="crumb"><button class="link" id="back">← Unit 1 topics</button></nav>
  <section>
    <small class="dim" id="topicNum"></small>
    <h2 id="topicTitle" style="margin-top:2px"></h2>
    <div class="learn" id="learn"></div>
    <button class="link" id="learnAgain" hidden>Show the idea again</button>
    <canvas id="wheel" aria-label="Angle circle"></canvas>
    <div class="row" id="startRow"><button class="act alt" id="watch">Watch again</button><button class="act" id="start">Practice →</button></div>
    <div id="practice" hidden>
      <div class="dotsRow"><span class="progress small" id="dots"></span><small class="dim" id="dotsText"></small></div>
      <p class="q" id="qText"></p>
      <div class="choices text" id="choices"></div>
      <div id="padWrap" hidden><div class="padOut"><span id="padOut"></span><span class="dim" id="padUnit"></span></div><div class="pad" id="pad"></div></div>
      <div class="row"><button class="act" id="check">Check</button><button class="act" id="next" hidden>Next question</button></div>
      <div id="feedback" aria-live="polite"></div>
    </div>
    <div id="done" hidden class="reveal"><p class="ok" id="doneText"></p><div class="row"><button class="act" id="nextTopic">Next topic →</button></div></div>
  </section>
</div>

<script type="module">
import { runUnit, PI, TAU, D, C, deg, rad, piFrac, dec, options, pick } from './engine.js?v=3';

const Q = ['', 'a quarter turn', 'two quarter turns (a half turn)', 'three quarter turns', 'a full turn'];
const PART = { 0: '', 30: 'a third of a quarter turn', 45: 'half of a quarter turn', 60: 'two thirds of a quarter turn' };
function degWhy(t) {
  const d = Math.round(Math.abs(t) * 180 / PI), q = Math.floor(d / 90), r = d - 90 * q, dir = t < 0 ? ', clockwise' : '';
  if (!r) return `${deg(t)} is ${Q[q]}${dir}.`;
  return `${deg(t)} = ${q ? `${90 * q}° + ` : ''}${r}°: ${q ? Q[q] + ' plus ' : ''}${PART[r]}${dir}.`;
}
function radWhy(t) {
  const f = piFrac(t); if (!f || !f.includes('/')) return `${f} is ${f === 'π' ? 'a half turn' : f === '2π' ? 'a full turn' : f === '−π' ? 'a half turn clockwise' : 'whole half turns'} (${deg(t)}).`;
  const d = +f.split('/')[1], n = Math.round(Math.abs(t) / (PI / d));
  return `${f} is ${n} step${n > 1 ? 's' : ''} of π/${d} (each ${180 / d}°)${t < 0 ? ', clockwise' : ''}: ${deg(t)}.`;
}
const dragQ = (t, fmt, why, extra = {}) => ({ type: 'drag', t, fmt, prompt: `Turn the dot to <b>${fmt(t)}</b>.`, why: why(t), ...extra });
const readQ = (t, pool, fmt, why, prompt = 'What angle is shown?') => ({ type: 'choice', prompt, show: { t }, ...options(t, pool, fmt), why: why(t) });
const R4 = [1, 3, 5, 7, -1, -3].map(k => k * PI / 4), R6 = [1, 2, 4, 5, 7, 8, 10, 11].map(k => k * PI / 6);

const topics = [
  { id: 'turns', title: 'Angles are turns', grid: D(45), snap: D(15),
    learn: '<p>An angle measures <b>turning</b>. Start pointing right and turn <b>counterclockwise ↺</b>.</p><p>A quarter turn is <b>90°</b>, a half turn <b>180°</b>, a full turn <b>360°</b>.</p>',
    example: { t: D(90), label: '90°' },
    gens: [
      p => dragQ(D(p([90, 180, 270, 45, 135])), deg, degWhy),
      p => readQ(D(p([90, 180, 270, 45, 135, 225])), [45, 90, 135, 180, 225, 270, 315].map(D), deg, degWhy),
      p => { const k = p([1, 2, 3, 4]); return { type: 'choice', prompt: `<b>${['', 'A quarter', 'A half', 'Three quarters of a', 'A full'][k]} turn</b> is how many degrees?`, ...options(90 * k, [90, 180, 270, 360, 45, 100], d => d + '°'), show: { t: D(90 * k) }, why: `Each quarter turn is 90°, so ${k} × 90° = ${90 * k}°.`, reveal: D(90 * k) }; },
    ] },
  { id: 'thirty', title: 'Steps of 30°', grid: D(30), snap: D(15),
    learn: '<p>Cut a quarter turn into <b>3 equal steps</b>. Each step is <b>30°</b>.</p><p>So 60° is two steps, and 120° is a quarter turn plus one step.</p>',
    example: { t: D(120), label: '120°' },
    gens: [
      p => dragQ(D(p([30, 60, 120, 150, 210, 240, 300, 330])), deg, degWhy),
      p => readQ(D(p([30, 60, 120, 150, 210, 240, 300, 330])), [30, 60, 120, 150, 210, 240, 300, 330].map(D), deg, degWhy),
    ] },
  { id: 'negative', title: 'Negative angles turn clockwise', grid: D(45), snap: D(15),
    learn: '<p>Turning the other way, <b>clockwise ↻</b>, gives a <b>negative</b> angle.</p><p>−90° is a quarter turn clockwise: it ends pointing down.</p>',
    example: { t: D(-90), label: '−90°' },
    gens: [
      p => dragQ(D(p([-90, -45, -180, -135, -270, -30, -60])), deg, degWhy),
      p => { const d = p([90, 45, 135, 30, 60, 180]); return readQ(D(-d), [-d, d, -(d + 45), -(d + 90), 360 - d].map(D), deg, degWhy); },
      p => readQ(D(p([45, 135, 270, 60])), [45, 135, 270, 60, -45, -135, -270, -60].map(D), deg, degWhy),
    ] },
  { id: 'pi', title: 'Radians: π is a half turn', grid: D(90), snap: D(15),
    learn: '<p>Mathematicians usually measure turns in <b>radians</b>. The one fact to know: <b>a half turn is π</b>.</p><p>So a quarter turn is <b>π/2</b> and a full turn is <b>2π</b>. (Why π? That comes in topic 9.)</p>',
    example: { t: PI, label: 'π' },
    gens: [
      p => dragQ(p([PI, PI / 2, 3 * PI / 2, -PI / 2, -PI]), rad, radWhy),
      p => readQ(p([PI / 2, PI, 3 * PI / 2, -PI / 2]), [PI / 2, PI, 3 * PI / 2, -PI / 2, 2 * PI], rad, radWhy),
      p => { const k = p([1, 2, 3, 4]), t = k * PI / 2; return { type: 'choice', prompt: `<b>${['', 'A quarter', 'A half', 'Three quarters of a', 'A full'][k]} turn</b> in radians is…`, ...options(t, [PI / 2, PI, 3 * PI / 2, 2 * PI, 4 * PI], rad), show: { t }, why: `A half turn is π, so ${['', 'a quarter turn is half of that: π/2', 'it is π', 'three quarter turns are 3 × π/2 = 3π/2', 'a full turn is two of them: 2π'][k]}.` }; },
    ] },
  { id: 'quarters', title: 'Steps of π/4', grid: D(45), snap: D(15),
    learn: '<p>Half of a quarter turn is <b>π/4</b> (45°).</p><p>Count in π/4 steps: π/4, 2π/4 = π/2, <b>3π/4</b>, 4π/4 = π, 5π/4…</p>',
    example: { t: 3 * PI / 4, label: '3π/4' },
    gens: [p => dragQ(p(R4), rad, radWhy), p => readQ(p(R4), R4.concat([PI / 2, PI]), rad, radWhy)] },
  { id: 'sixths', title: 'Steps of π/6 and π/3', grid: D(30), snap: D(15),
    learn: '<p>Cut a half turn into <b>6 steps</b>: each is <b>π/6</b> (30°).</p><p>Two steps, 2π/6, simplify to <b>π/3</b> (60°). Four steps are <b>2π/3</b>.</p>',
    example: { t: 2 * PI / 3, label: '2π/3' },
    gens: [p => dragQ(p(R6), rad, radWhy), p => readQ(p(R6), R6, rad, radWhy)] },
  { id: 'convert', title: 'Switching degrees and radians', grid: D(30),
    learn: '<p>Since <b>π = 180°</b>, swap one for the other.</p><p>π/3 = 180°/3 = <b>60°</b>. Back again: 60° is 60/180 = 1/3 of a half turn, so <b>π/3</b>.</p>',
    example: { t: PI / 3, label: 'π/3 = 60°' },
    gens: [
      p => { const t = p([PI / 6, PI / 4, PI / 3, PI / 2, 2 * PI / 3, 3 * PI / 4, 5 * PI / 6, 3 * PI / 2]), d = Math.round(t * 180 / PI);
        return { type: 'pad', prompt: `<b>${rad(t)}</b> = how many degrees?`, unit: '°', ans: d, tol: .5, answerText: d + '°', show: { t }, why: `Replace π with 180°: ${rad(t).replace('π', '180°')} = ${d}°.`,
          hint: v => Math.abs(v - t) < .02 ? 'That\'s the radian value as a decimal. Replace π with 180°.' : null }; },
      p => { const d = p([30, 45, 60, 90, 120, 135, 150, 270]), t = D(d); return { type: 'pad', prompt: `Write <b>${d}°</b> in radians.`, unit: 'rad', ans: t, answerText: rad(t), show: { t },
          why: `${d}/180 of a half turn: ${d}° = ${rad(t)}.`, hint: v => Math.abs(v - d) < .5 ? 'That\'s still in degrees. Use π for each half turn.' : null }; },
      p => { const d = p([30, 45, 60, 120, 135, 150, 210, 240, 300]), t = D(d); return { type: 'choice', prompt: `<b>${d}°</b> in radians is…`, ...options(t, [PI / 6, PI / 4, PI / 3, 2 * PI / 3, 3 * PI / 4, 5 * PI / 6, 7 * PI / 6, 4 * PI / 3, 5 * PI / 3, 3 * PI / 2], rad), show: { t }, why: `${d}/180 of a half turn, so ${rad(t)}.` }; },
    ] },
  { id: 'wrap', title: 'More than a full turn', grid: D(45), snap: D(15),
    learn: '<p>Keep turning past a full turn and the angle keeps growing.</p><p><b>2π + π/2 = 5π/2</b> ends in the same place as π/2. Angles that end together are called <b>coterminal</b>.</p>',
    example: { t: 5 * PI / 2, label: '5π/2' },
    gens: [
      p => dragQ(p([5 * PI / 2, 9 * PI / 4, 3 * PI, 7 * PI / 3]), rad, t => `${rad(t)} = 2π + ${rad(t - TAU)}: one full turn, then ${rad(t - TAU)} more.`, { exact: true, grid: D(30) }),
      p => { const b = p([PI / 2, PI / 3, 3 * PI / 4, PI, PI / 6]), m = p([1, 1, 2]), t = b + m * TAU; return { type: 'choice', prompt: `Which angle between 0 and 2π ends in the same place as <b>${rad(t)}</b>?`, ...options(b, [b, t - PI, b + PI, PI / 2, PI / 3, 3 * PI / 4, PI / 6].filter(x => x > 0 && x < TAU), rad), show: { t }, why: `Take away ${m > 1 ? m + ' full turns' : 'a full turn'}: ${rad(t)} − ${m > 1 ? m * 2 + 'π' : '2π'} = ${rad(b)}.` }; },
      p => { const b = p([PI / 2, PI / 4, PI / 3, PI]), t = -b; return { type: 'choice', prompt: `<b>${rad(t)}</b> ends in the same place as which positive angle?`, ...options(TAU - b, [TAU - b, b, PI - b, PI + b].filter(x => x > 0), rad), show: { t }, why: `Add a full turn: ${rad(t)} + 2π = ${rad(TAU - b)}.` }; },
    ] },
  { id: 'why-pi', title: 'Where π comes from', grid: 0, snap: .5,
    learn: '<p>Lay a string <b>as long as the radius</b> around the edge. The turn it covers is <b>1 radian</b>.</p><p>A half turn takes about <b>3.14</b> strings. That number is <b>π</b>.</p>',
    example: { t: PI, label: 'π ≈ 3.14 strings', string: true },
    gens: [
      p => { const t = p([1, 2, 3, 4, 5, 1.5, 2.5]); return { type: 'drag', t, string: true, fmt: v => dec(v) + ' rad', prompt: `Turn the dot to <b>${dec(t)} radians</b>: ${dec(t)} radius-strings of edge.`, why: `Count the blue string pieces: ${dec(t)} of them.` }; },
      p => ({ type: 'choice', prompt: 'How many radius-strings fit around the <b>whole</b> circle?', ...options('about 6.28 (2π)', ['about 6.28 (2π)', 'about 3.14 (π)', 'exactly 4', '360']), show: { t: TAU, string: true }, why: 'A half turn is π ≈ 3.14 strings, so a full turn is 2π ≈ 6.28.' }),
      p => { const t = p([PI / 2, 3 * PI / 2, PI]); return { type: 'choice', prompt: `About how many radius-strings does <b>${rad(t)}</b> take?`, ...options(dec(t), [1.57, 3.14, 4.71, 6.28, 2, 3].map(dec)), show: { t, string: true }, why: `π ≈ 3.14, so ${rad(t)} ≈ ${dec(t)}.` }; },
    ] },
  { id: 'arc', title: 'Arc length', grid: 0, snap: .5,
    learn: '<p>Each radian of turning moves <b>one radius</b> along the edge.</p><p>So <b>arc length = radius × angle</b> (angle in radians). Radius 3 cm, turn 2 → 6 cm.</p>',
    example: { t: 2, label: '2 radii of edge', string: true },
    gens: [
      p => { const r = p([2, 3, 4, 5, 10]), t = p([1, 2, 3, 0.5]); return { type: 'pad', prompt: `Radius <b>${r} cm</b>, turn <b>${dec(t)} radian${t === 1 ? '' : 's'}</b>. How long is the arc?`, unit: 'cm', ans: r * t, answerText: dec(r * t) + ' cm', show: { t, string: true }, why: `${r} × ${dec(t)} = ${dec(r * t)} cm.` }; },
      p => { const r = p([2, 3, 5, 10]), t = p([PI, PI / 2, TAU]); return { type: 'pad', prompt: `Radius <b>${r} cm</b>, turn <b>${rad(t)}</b>. How long is the arc? (You can type π.)`, unit: 'cm', ans: r * t, answerText: `${piFrac(r * t)} ≈ ${dec(r * t)} cm`, show: { t, string: true }, why: `${r} × ${rad(t)} = ${piFrac(r * t)} ≈ ${dec(r * t)} cm.`,
        hint: v => Math.abs(v - r * t * 180 / PI) < 1 ? 'That used degrees. Multiply by the angle in radians.' : null }; },
    ] },
];

window.u1 = runUnit({ unit: 1, topics, storeKey: 'trig-unit1-v2' });
</script>
</body>
</html>
